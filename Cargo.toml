[package]
name = "runpod-pipeline"
version = "0.1.0"
edition = "2021"
authors = ["RunPod Pipeline Developer"]
description = "A modular, asynchronous Rust application for orchestrating RunPod AI pipelines (Text-to-Video, Image-to-Video, LLM enhancement, etc.)"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = { version = "0.17", features = ["tokio"] }
dialoguer = { version = "0.11", default-features = false, features = ["editor"] }
console = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
base64 = "0.22"
rand = "0.8"
async-trait = "0.1"
open = "5.3"
futures-util = "0.3"
mime_guess = "2.0"
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
